<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Dominion</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: #090b10;
            color: white;
            font-family: Arial, sans-serif;

            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .container {
            max-width: 900px;
            padding: 40px 20px;
        }

        h1 {
            font-size: 80px;
            margin: 0;
            letter-spacing: 8px;
        }

        .tagline {
            color: #aaa;
            font-size: 22px;
            margin-top: 10px;
        }

        .description {
            color: #ccc;
            max-width: 600px;
            margin: 30px auto;
            line-height: 1.6;
        }

        .download {
            display: inline-block;
            margin-top: 20px;
            padding: 18px 35px;

            background: white;
            color: black;

            text-decoration: none;
            font-weight: bold;
            font-size: 18px;

            border-radius: 6px;
        }

        .download:hover {
            background: #ddd;
        }

        .version {
            margin-top: 20px;
            color: #666;
            font-size: 14px;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>DOMINION</h1>

    <div class="tagline">
        Command. Conquer. Survive.
    </div>

    <div class="description">
        A fast-paced arena combat game where you command a squad
        of heroes, switch between them in real time and fight
        for control of the battlefield.
    </div>

    <a class="download" href="#">
        DOWNLOAD FOR WINDOWS
    </a>

    <div class="version">
        Alpha Version
    </div>

</div>

</body>
</html>
